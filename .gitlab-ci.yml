stages:
  - build
  - test


variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip

build_job:
  stage: build
  image: python:3.12-slim
  script:
    - pip install --upgrade pip setuptools wheel
    - pip install -r requirements.txt
    - pip install -r requirements-dev.txt
    - python3 -m compileall app/

unit_test_job:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - pip install -r requirements-dev.txt
    - pytest -v tests/unit

integration_test_job:
  stage: test
  script:
    - apk add --no-cache python3 py3-pip
    - pip install -r requirements.txt --break-system-packages
    - pip install -r requirements-dev.txt --break-system-packages
    - docker compose -f tests/integration/docker-compose.yml up -d
    - sleep 10
    - cat /etc/hosts
    - ip addr
    - docker ps
    - tree
    - docker logs inventory-mock
    - JOB_ID=$(docker ps | grep project-2-concurrent-0 | cut -d ' ' -f 1)
    - docker inspect $JOB_ID | grep -A 10 Networks
    - docker inspect api-gateway | grep -A 10 Networks
    - |
      for i in $(seq 1 30); do
        wget -q -O- http://api-gateway:3000/health
        echo 
        wget -q -O- http://api-gateway:3000/api/movies && echo && break
        echo "Waiting for api-gateway..."
        sleep 1
      done
    - docker logs inventory-mock
    - pytest -v tests/integration
  after_script:
    - docker compose -f tests/integration/docker-compose.yml down

