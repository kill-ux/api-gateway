stages:
  - build
  - test
  - scan
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip

build_job:
  stage: build
  image: python:3.12-slim
  script:
    - pip install --upgrade pip setuptools wheel
    - pip install -r requirements.txt
    - pip install -r requirements-dev.txt
    - python3 -m compileall app/

unit_test_job:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - pip install -r requirements-dev.txt
    - pytest -v tests/unit --cov=app --cov-report=xml:coverage.xml --cov-report=term --junitxml=test-results.xml
  artifacts:
    paths:
      - coverage.xml
      - test-results.xml
    expire_in: 1h
  dependencies: []

integration_test_job:
  stage: test
  script:
    - apk add --no-cache python3 py3-pip
    - pip install -r requirements.txt --break-system-packages
    - pip install -r requirements-dev.txt --break-system-packages
    - docker compose -f tests/integration/docker-compose.yml up -d --wait
    - pytest -v tests/integration
  after_script:
    - docker compose -f tests/integration/docker-compose.yml down --rmi local
  dependencies: []

sonarqube-check:
  stage: scan
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" # Defines the location of the analysis task cache
    GIT_DEPTH: "0" # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  only:
    - main

trivy_dependency_scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --quiet --scanners vuln,secret,misconfig --exit-code 1 .

containerize_app:
  stage: deploy
  variables:
    DOCKERHUB_REPO: $DOCKERHUB_USER/api-gateway
  before_script:
    - echo $DOCKERHUB_PASS | docker login -u $DOCKERHUB_USER --password--stdin
  script:
    - TAG_ARGS="-t $DOCKERHUB_REPO:$CI_COMMIT_SHA"
    - |
      if [ -n $CI_COMMIT_TAG ]; then
        TAG_ARGS="$TAG_ARGS -t $DOCKERHUB_REPO:$CI_COMMIT_TAG -t $DOCKERHUB_REPO:latest"
      fi
    - docker build $TAG_ARGS
  dependencies: []