networks:
  integration-net:
    external: true

services:
  api-gateway:
    container_name: api-gateway
    networks:
      - integration-net
    build:
      context: ../../
    environment:
      APIGATEWAY_PORT: 3000
      INVENTORY_APP_HOST: inventory-mock
      INVENTORY_APP_PORT: 8500
      BILLING_APP_HOST: billing-mock
      BILLING_APP_PORT: 8500
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_QUEUE: rabbit
      RABBITMQ_USER: rabbit
      RABBITMQ_PASS: rabbit
      RABBITMQ_PORT: "5672"
    ports:
      - "3000:3000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      inventory-mock:
        condition: service_started
      billing-mock:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 1s
  inventory-mock:
    container_name: inventory-mock
    networks: 
      - integration-net
    build:
      context: .
      dockerfile: hoverfly.Dockerfile
      args:
        MOCK_FILE: inventory 
    command:
      - "-webserver"
      - "-import=/hoverfly/inventory.json"
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8500/api/movies"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 1s

  billing-mock:
    container_name: billing-mock
    networks:
      - integration-net
    build:
      context: .
      dockerfile: hoverfly.Dockerfile
      args:
        MOCK_FILE: billing    
    command:
      - "-webserver"
      - "-import=/hoverfly/billing.json"
    ports:
      - "8501:8500"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8500/api/billing/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 1s
  
  rabbitmq:
    container_name: rabbitmq
    networks:
      - integration-net
    image: killux3k/rabbitmq:1.0.0
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    environment:
      RABBITMQ_USER: rabbit
      RABBITMQ_PASS: rabbit
      RABBITMQ_QUEUE: rabbit